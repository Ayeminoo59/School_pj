{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create Account</h1>
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" name="name" placeholder="Enter your full name" required autofocus maxlength="120">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="student@university.com" required maxlength="120">
      </div>

      <div class="form-group">
        <label class="form-label" for="course">Course / Programme</label>
        <input class="form-input" type="text" id="course" name="course" placeholder="e.g., BSc Computer Science" required maxlength="120">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="Min 8 characters" required minlength="8">
        <p class="form-hint">Use at least 8 characters.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input class="form-input" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required minlength="8">
      </div>

      <button type="submit" class="btn btn-block">Register →</button>
    </form>

    <p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
  </div>
</div>
{% endblock %}
